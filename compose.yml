services:    
    malstrek-db:
      image: timescale/timescaledb:2.18.0-pg17
      container_name: malstrek-db
      hostname: malstrek-db
      ports:
        - "${TIMESCALEDB_LOCAL_PORT}:${TIMESCALEDB_PORT}"
      environment:
        POSTGRES_DB: ${TIMESCALEDB_DB}
        POSTGRES_USER: ${TIMESCALEDB_USER}
        POSTGRES_PASSWORD: ${TIMESCALEDB_PASSWORD}
      volumes:
        - malstrek_db_data:/var/lib/postgresql/data
      networks:
        - streamer_default
      restart: always

    migrate-pg:
      build: 
        context: .
        dockerfile: Dockerfile
        target: migrate_tool_postgres
      container_name: migrate-pg
      depends_on:
        - malstrek-db
      volumes:
        - ./migrations/postgres:/migrations-postgres
      env_file: ".env"
      command: ["migrate", "-database", "postgres://$TIMESCALEDB_USER:$TIMESCALEDB_PASSWORD@$TIMESCALEDB_HOST:$TIMESCALEDB_PORT/$TIMESCALEDB_DB?sslmode=disable", "-path", "/migrations-postgres", "up"]
      networks:
        - streamer_default

    init-kafka:
      image: confluentinc/cp-server:8.1.1
      container_name: init-kafka
      depends_on:
        - malstrek-db
      volumes:
        - ./scripts:/scripts
        - ./connector_configs:/connector_configs
        - ./app/src/main/avro:/avro
      env_file: ".env"
      environment:
        KAFKA_BOOTSTRAP_SERVERS: broker:29092
        KAFKA_SCHEMA_REGISTRY_URL: http://schema-registry:8081
        KAFKA_CONNECT_URL: http://connect:8083
      networks:
        - streamer_default
      command: >
        /bin/bash -lc '
          chmod +x /scripts/*.sh &&
          /scripts/init-kafka.sh
        '
      restart: "on-failure:3"

    malstrek-app:
      build: 
        context: .
        dockerfile: Dockerfile
        target: java_runner
      depends_on:
        - malstrek-db
        - migrate-pg
        - init-kafka
      ports:
        - "8080:8080"
      env_file: ".env"
      networks:
        - streamer_default
      environment:
        KAFKA_BOOTSTRAP_SERVERS: broker:29092

    metabase:
      image: metabase/metabase:v0.56.8
      container_name: metabase
      hostname: metabase
      volumes:
        - /dev/urandom:/dev/random:ro
      ports:
        - 3000:3000
      env_file: ".env"
      networks:
        - streamer_default
      healthcheck:
        test: curl --fail -I http://localhost:3000/api/health || exit 1
        interval: 15s
        timeout: 5s
        retries: 5

    metabase-db:
      image: postgres:18.0
      container_name: metabase-db
      hostname: metabase-db
      volumes:
        - metabase_db_data:/var/lib/postgresql/data
      env_file: ".env"
      networks:
        - streamer_default

volumes:
  metabase_db_data:
  malstrek_db_data:

networks:
  streamer_default:
    external: true
    name: streamer_default